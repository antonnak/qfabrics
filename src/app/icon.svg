<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="32" fill="#0A0A0A"/>

  <!-- Complex mesh network -->
  <g opacity="0.5">
    <!-- Outer connections -->
    <line x1="18" y1="14" x2="32" y2="22" stroke="#14B8A6" stroke-width="1"/>
    <line x1="46" y1="14" x2="32" y2="22" stroke="#14B8A6" stroke-width="1"/>
    <line x1="54" y1="28" x2="42" y2="32" stroke="#14B8A6" stroke-width="1"/>
    <line x1="54" y1="36" x2="42" y2="32" stroke="#14B8A6" stroke-width="1"/>
    <line x1="46" y1="50" x2="32" y2="42" stroke="#14B8A6" stroke-width="1"/>
    <line x1="18" y1="50" x2="32" y2="42" stroke="#14B8A6" stroke-width="1"/>
    <line x1="10" y1="36" x2="22" y2="32" stroke="#14B8A6" stroke-width="1"/>
    <line x1="10" y1="28" x2="22" y2="32" stroke="#14B8A6" stroke-width="1"/>

    <!-- Cross connections -->
    <line x1="18" y1="14" x2="22" y2="32" stroke="#14B8A6" stroke-width="0.8" opacity="0.6"/>
    <line x1="46" y1="14" x2="42" y2="32" stroke="#14B8A6" stroke-width="0.8" opacity="0.6"/>
    <line x1="46" y1="50" x2="42" y2="32" stroke="#14B8A6" stroke-width="0.8" opacity="0.6"/>
    <line x1="18" y1="50" x2="22" y2="32" stroke="#14B8A6" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Inner mesh structure -->
  <g>
    <line x1="32" y1="22" x2="42" y2="32" stroke="#14B8A6" stroke-width="2"/>
    <line x1="32" y1="22" x2="22" y2="32" stroke="#14B8A6" stroke-width="2"/>
    <line x1="42" y1="32" x2="32" y2="42" stroke="#14B8A6" stroke-width="2"/>
    <line x1="22" y1="32" x2="32" y2="42" stroke="#14B8A6" stroke-width="2"/>
    <line x1="22" y1="32" x2="42" y2="32" stroke="#14B8A6" stroke-width="2"/>

    <!-- Center connections -->
    <line x1="32" y1="22" x2="32" y2="32" stroke="#14B8A6" stroke-width="2"/>
    <line x1="32" y1="32" x2="32" y2="42" stroke="#14B8A6" stroke-width="2"/>
    <line x1="22" y1="32" x2="32" y2="32" stroke="#14B8A6" stroke-width="2"/>
    <line x1="32" y1="32" x2="42" y2="32" stroke="#14B8A6" stroke-width="2"/>
  </g>

  <!-- Outer nodes -->
  <circle cx="18" cy="14" r="2" fill="#14B8A6" opacity="0.7"/>
  <circle cx="46" cy="14" r="2" fill="#14B8A6" opacity="0.7"/>
  <circle cx="54" cy="28" r="2" fill="#14B8A6" opacity="0.7"/>
  <circle cx="54" cy="36" r="2" fill="#14B8A6" opacity="0.7"/>
  <circle cx="46" cy="50" r="2" fill="#14B8A6" opacity="0.7"/>
  <circle cx="18" cy="50" r="2" fill="#14B8A6" opacity="0.7"/>
  <circle cx="10" cy="36" r="2" fill="#14B8A6" opacity="0.7"/>
  <circle cx="10" cy="28" r="2" fill="#14B8A6" opacity="0.7"/>

  <!-- Primary nodes -->
  <circle cx="32" cy="22" r="3" fill="#14B8A6"/>
  <circle cx="42" cy="32" r="3" fill="#14B8A6"/>
  <circle cx="32" cy="42" r="3" fill="#14B8A6"/>
  <circle cx="22" cy="32" r="3" fill="#14B8A6"/>
  <circle cx="32" cy="32" r="4" fill="#14B8A6"/>
</svg>
